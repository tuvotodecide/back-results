name: CI & CD for NestJS Project

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.ts'
      - 'tsconfig.json'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_PLATFORMS: linux/arm64
  CACHE_TAG: buildcache

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    name: Run Backend Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: devops_aws
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SSM_ENV_PARAM_NAME: ${{ vars.SSM_ENV_PARAM_NAME }}
      SSM_ENV_PARAM_NAME_SEC: ${{ vars.SSM_ENV_PARAM_NAME_SEC }}
      SSM_ENV_PARAM_NAME_TEST: ${{ vars.SSM_ENV_PARAM_NAME_TEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get .env File
        run: |
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME }}" --with-decryption --query Parameter.Value --output text > .env
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME_SEC }}" --with-decryption --query Parameter.Value --output text >> .env
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME_TEST }}" --with-decryption --query Parameter.Value --output text >> .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=$(wc -c < .env) lines=$(wc -l < .env)"

      - name: Run unit tests
        run: npm run test:unit

      - name: Run acceptance tests
        run: npm run test:acceptance

      - name: Run integration tests
        run: npm run test:integration

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Cleanup .env
        run: shred -u .env || rm -f .env

  build:
    name: Build & Push Docker image
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: devops_aws
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.12.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Decrypt TLS bundle
        run: |
          set -euo pipefail
          if [ ! -f global-bundle.pem.enc ]; then
            echo "global-bundle.pem.enc not found"; exit 1
          fi
          openssl enc -aes-256-cbc -d -salt \
            -in global-bundle.pem.enc \
            -out global-bundle.pem \
            -pass pass:"${{ secrets.PASSPHRASE }}"
          echo "BUNDLE_SHA256=$(sha256sum global-bundle.pem | cut -d' ' -f1)"

      - name: Set image tag
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          tags="${ECR_REGISTRY}/${ECR_REPO}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=$'\n'"${ECR_REGISTRY}/${ECR_REPO}:latest"
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=$'\n'"${ECR_REGISTRY}/${ECR_REPO}:${GITHUB_REF_NAME}"
          fi
          printf "tags<<EOF\n%s\nEOF\n" "$tags" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-to: type=inline

      - name: Prune old untagged images in ECR
        run: |
          set -euo pipefail
          IMAGE_IDS=$(aws ecr list-images \
            --repository-name "${{ env.ECR_REPO }}" \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*]' --output json)
          if [ "$IMAGE_IDS" != "[]" ]; then
            echo "$IMAGE_IDS" | jq -c '[_nwise(100)][]' | while read -r BATCH; do
              aws ecr batch-delete-image \
                --repository-name "${{ env.ECR_REPO }}" \
                --image-ids "$BATCH"
            done
          fi

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    name: Deploy to EC2 (dev) via SSM
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: devops_aws
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      PUBLIC_IP: ${{ vars.PUBLIC_IP }}
      EXTERNAL_PORT: ${{ vars.EXTERNAL_PORT }}
      CONTAINER_NAME: back_results
      IMAGE_TAG: ${{ github.sha }}
      SSM_ENV_PARAM_NAME: ${{ vars.SSM_ENV_PARAM_NAME }}
      SSM_ENV_PARAM_NAME_SEC: ${{ vars.SSM_ENV_PARAM_NAME_SEC }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy container via SSM
        id: ssm
        shell: bash
        run: |
          set -euo pipefail
          SSM_NAME="${{ env.SSM_ENV_PARAM_NAME }}"
          SSM_NAME_SEC="${{ env.SSM_ENV_PARAM_NAME_SEC }}"
          echo "Deploying ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} to ${{ env.EC2_INSTANCE_ID }}"
          echo "Using SSM parameter: ${SSM_NAME}"

          cat > remote_cmds.txt <<'EOF'
          set -euo pipefail
          docker system prune -a -f --volumes
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
          docker pull --quiet ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
          docker stop ${CONTAINER_NAME} || true
          docker rm ${CONTAINER_NAME} || true
          aws ssm get-parameter --name ${SSM_NAME} --with-decryption --query Parameter.Value --output text > .env
          aws ssm get-parameter --name ${SSM_NAME_SEC} --with-decryption --query Parameter.Value --output text >> .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=$(wc -c < .env) lines=$(wc -l < .env)"
          docker run -d --name ${CONTAINER_NAME} -p ${EXTERNAL_PORT}:3000 --env-file .env -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem --restart unless-stopped ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
          sleep 2
          docker exec ${CONTAINER_NAME} /bin/sh -lc 'set -e; [ -f /app/global-bundle.pem ] && echo "bundle OK" && ls -l /app/global-bundle.pem && sha256sum /app/global-bundle.pem | cut -c1-16 || (echo "bundle MISSING"; exit 1)'
          docker exec ${CONTAINER_NAME} /bin/sh -lc 'env | grep -E "^(MONGODB_URI|MONGODB_USERNAME|MONGODB_PASSWORD|NODE_EXTRA_CA_CERTS)=" | sed "s/=.*/=[REDACTED]/"'
          docker inspect --format="Name={{.Name}} Image={{.Config.Image}} Cmd={{.Config.Cmd}} Entrypoint={{.Config.Entrypoint}}" ${CONTAINER_NAME} || true
          docker image inspect ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG} --format 'RepoDigests: {{json .RepoDigests}} Cmd: {{json .Config.Cmd}} Entrypoint: {{json .Config.Entrypoint}}' || true
          docker network connect results-net ${CONTAINER_NAME} || true
          shred -u .env || rm -f .env
          docker system prune -a -f --volumes
          EOF

          sed -i "s|\${AWS_REGION}|${{ env.AWS_REGION }}|g" remote_cmds.txt
          sed -i "s|\${ECR_REGISTRY}|${{ env.ECR_REGISTRY }}|g" remote_cmds.txt
          sed -i "s|\${ECR_REPO}|${{ env.ECR_REPO }}|g" remote_cmds.txt
          sed -i "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" remote_cmds.txt
          sed -i "s|\${CONTAINER_NAME}|${{ env.CONTAINER_NAME }}|g" remote_cmds.txt
          sed -i "s|\${EXTERNAL_PORT}|${{ env.EXTERNAL_PORT }}|g" remote_cmds.txt
          sed -i "s|\${SSM_NAME}|${SSM_NAME}|g" remote_cmds.txt
          sed -i "s|\${SSM_NAME_SEC}|${SSM_NAME_SEC}|g" remote_cmds.txt
          CMDS_JSON=$(jq -R -s -c 'split("\n") | map(select(length>0))' < remote_cmds.txt)

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy" \
            --parameters "commands=${CMDS_JSON}" \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId = ${CMD_ID}"
          aws ssm wait command-executed --command-id "${CMD_ID}" --instance-id "${{ env.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "{Stdout:StandardOutputContent, Stderr:StandardErrorContent, Status:Status}" \
            --output text | sed 's/\\n/\n/g'

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query Status --output text)
          [[ "${STATUS}" == "Success" ]] || { echo "Remote script failed"; exit 1; }

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking http://${{ env.PUBLIC_IP }}:${{ env.EXTERNAL_PORT }}/"
          for i in {1..24}; do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${{ env.PUBLIC_IP }}:${{ env.EXTERNAL_PORT }}/") || true
            if [[ "${http_code:-}" == "200" ]]; then
              echo "Service OK (${http_code})"
              exit 0
            fi
            echo "Retry $i/24 — code=${http_code:-timeout}"
            sleep 5
          done
          echo "Health-check failed, dumping container logs"
          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="docker logs --tail 200 ${{ env.CONTAINER_NAME }}" \
            --query "Command.CommandId" --output text \
          | xargs -I{} aws ssm wait command-executed --command-id {} --instance-id "${{ env.EC2_INSTANCE_ID }}"
          exit 1

  deploy-prod:
    name: Deploy to EC2 (prod) via SSM
    needs: build
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: devops_aws
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      PUBLIC_IP: ${{ vars.PUBLIC_IP }}
      EXTERNAL_PORT: ${{ vars.EXTERNAL_PORT_PROD }}
      CONTAINER_NAME: back_results_prod
      IMAGE_TAG: ${{ github.ref_name }}
      SSM_ENV_PARAM_NAME: ${{ vars.SSM_ENV_PARAM_NAME_PROD }}
      SSM_ENV_PARAM_NAME_SEC: ${{ vars.SSM_ENV_PARAM_NAME_PROD_SEC }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy container via SSM
        id: ssm
        shell: bash
        run: |
          set -euo pipefail
          SSM_NAME="${{ env.SSM_ENV_PARAM_NAME }}"
          SSM_NAME_SEC="${{ env.SSM_ENV_PARAM_NAME_SEC }}"
          echo "Deploying ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} to ${{ env.EC2_INSTANCE_ID }}"
          echo "Using SSM parameter: ${SSM_NAME}"

          cat > remote_cmds.txt <<'EOF'
          set -euo pipefail
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
          docker pull --quiet ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
          docker stop ${CONTAINER_NAME} || true
          docker rm ${CONTAINER_NAME} || true
          aws ssm get-parameter --name ${SSM_NAME} --with-decryption --query Parameter.Value --output text > .env
          aws ssm get-parameter --name ${SSM_NAME_SEC} --with-decryption --query Parameter.Value --output text >> .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=$(wc -c < .env) lines=$(wc -l < .env)"
          docker run -d --name ${CONTAINER_NAME} -p ${EXTERNAL_PORT}:3000 --env-file .env -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem --restart unless-stopped ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
          sleep 2
          docker exec ${CONTAINER_NAME} /bin/sh -lc 'set -e; [ -f /app/global-bundle.pem ] && echo "bundle OK" && ls -l /app/global-bundle.pem && sha256sum /app/global-bundle.pem | cut -c1-16 || (echo "bundle MISSING"; exit 1)'
          docker exec ${CONTAINER_NAME} /bin/sh -lc 'env | grep -E "^(MONGODB_URI|MONGODB_USERNAME|MONGODB_PASSWORD|NODE_EXTRA_CA_CERTS)=" | sed "s/=.*/=[REDACTED]/"'
          docker inspect --format="Name={{.Name}} Image={{.Config.Image}} Cmd={{.Config.Cmd}} Entrypoint={{.Config.Entrypoint}}" ${CONTAINER_NAME} || true
          docker image inspect ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG} --format 'RepoDigests: {{json .RepoDigests}} Cmd: {{json .Config.Cmd}} Entrypoint: {{json .Config.Entrypoint}}' || true
          docker network connect results-net ${CONTAINER_NAME} || true
          shred -u .env || rm -f .env
          docker image prune -f
          EOF

          sed -i "s|\${AWS_REGION}|${{ env.AWS_REGION }}|g" remote_cmds.txt
          sed -i "s|\${ECR_REGISTRY}|${{ env.ECR_REGISTRY }}|g" remote_cmds.txt
          sed -i "s|\${ECR_REPO}|${{ env.ECR_REPO }}|g" remote_cmds.txt
          sed -i "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" remote_cmds.txt
          sed -i "s|\${CONTAINER_NAME}|${{ env.CONTAINER_NAME }}|g" remote_cmds.txt
          sed -i "s|\${EXTERNAL_PORT}|${{ env.EXTERNAL_PORT }}|g" remote_cmds.txt
          sed -i "s|\${SSM_NAME}|${SSM_NAME}|g" remote_cmds.txt
          sed -i "s|\${SSM_NAME_SEC}|${SSM_NAME_SEC}|g" remote_cmds.txt
          CMDS_JSON=$(jq -R -s -c 'split("\n") | map(select(length>0))' < remote_cmds.txt)

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy" \
            --parameters "commands=${CMDS_JSON}" \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId = ${CMD_ID}"
          aws ssm wait command-executed --command-id "${CMD_ID}" --instance-id "${{ env.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "{Stdout:StandardOutputContent, Stderr:StandardErrorContent, Status:Status}" \
            --output text | sed 's/\\n/\n/g'

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query Status --output text)
          [[ "${STATUS}" == "Success" ]] || { echo "Remote script failed"; exit 1; }

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking http://${{ env.PUBLIC_IP }}:${{ env.EXTERNAL_PORT }}/"
          for i in {1..24}; do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${{ env.PUBLIC_IP }}:${{ env.EXTERNAL_PORT }}/") || true
            if [[ "${http_code:-}" == "200" ]]; then
              echo "Service OK (${http_code})"
              exit 0
            fi
            echo "Retry $i/24 — code=${http_code:-timeout}"
            sleep 5
          done
          echo "Health-check failed, dumping container logs"
          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="docker logs --tail 200 ${{ env.CONTAINER_NAME }}" \
            --query "Command.CommandId" --output text \
          | xargs -I{} aws ssm wait command-executed --command-id {} --instance-id "${{ env.EC2_INSTANCE_ID }}"
          exit 1
