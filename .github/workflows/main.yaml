name: CI & CD for NestJS Project

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.ts'
      - 'tsconfig.json'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Change to linux/arm64 if using Hetzner CAX (Ampere) instances
  BUILD_PLATFORMS: linux/amd64
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    name: Run Backend Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: hetzner
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          ENV_FILE_TEST: ${{ secrets.ENV_FILE_TEST }}
        run: |
          printf '%s\n' "${ENV_FILE}" > .env
          printf '%s\n' "${ENV_FILE_TEST}" >> .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=$(wc -c < .env) lines=$(wc -l < .env)"

      - name: Run unit tests
        run: npm run test:unit

      - name: Run acceptance tests
        run: npm run test:acceptance

      - name: Run integration tests
        run: npm run test:integration

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Cleanup .env
        if: always()
        run: shred -u .env || rm -f .env

  build:
    name: Build & Push Docker image
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hetzner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt TLS bundle
        run: |
          set -euo pipefail
          if [ ! -f global-bundle.pem.enc ]; then
            echo "global-bundle.pem.enc not found"; exit 1
          fi
          openssl enc -aes-256-cbc -d -salt \
            -in global-bundle.pem.enc \
            -out global-bundle.pem \
            -pass pass:"${{ secrets.PASSPHRASE }}"
          echo "BUNDLE_SHA256=$(sha256sum global-bundle.pem | cut -d' ' -f1)"

      - name: Set image tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags="${IMAGE}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=$'\n'"${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=$'\n'"${IMAGE}:${GITHUB_REF_NAME}"
          fi
          printf "tags<<EOF\n%s\nEOF\n" "$tags" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    name: Deploy to Hetzner (dev) via SSH
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hetzner
    permissions:
      contents: read
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          ENV_B64=$(printf '%s\n' "${ENV_FILE}" | base64 -w 0)
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" bash -s << ENDSSH
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --quiet "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker stop back_results || true
          docker rm back_results || true
          printf '%s' "${ENV_B64}" | base64 -d > .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=\$(wc -c < .env) lines=\$(wc -l < .env)"
          docker run -d \
            --name back_results \
            -p "${{ vars.EXTERNAL_PORT }}:3000" \
            --env-file .env \
            -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem \
            --restart unless-stopped \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          sleep 2
          docker exec back_results /bin/sh -lc \
            'set -e; [ -f /app/global-bundle.pem ] && echo "bundle OK" && ls -l /app/global-bundle.pem && sha256sum /app/global-bundle.pem | cut -c1-16 || (echo "bundle MISSING"; exit 1)'
          docker exec back_results /bin/sh -lc \
            'env | grep -E "^(MONGODB_URI|MONGODB_USERNAME|MONGODB_PASSWORD|NODE_EXTRA_CA_CERTS)=" | sed "s/=.*/=[REDACTED]/"'
          docker network connect results-net back_results || true
          shred -u .env || rm -f .env
          docker image prune -f
          ENDSSH

      - name: Health check
        run: |
          set -euo pipefail
          echo "Checking http://${{ vars.HETZNER_HOST }}:${{ vars.EXTERNAL_PORT }}/"
          for i in {1..24}; do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${{ vars.HETZNER_HOST }}:${{ vars.EXTERNAL_PORT }}/") || true
            if [[ "${http_code:-}" == "200" ]]; then
              echo "Service OK (${http_code})"
              exit 0
            fi
            echo "Retry $i/24 — code=${http_code:-timeout}"
            sleep 5
          done
          echo "Health-check failed, dumping container logs"
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" \
            "docker logs --tail 200 back_results"
          exit 1

  deploy-prod:
    name: Deploy to Hetzner (prod) via SSH
    needs: build
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hetzner_prod
    permissions:
      contents: read
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE_PROD }}
        run: |
          set -euo pipefail
          ENV_B64=$(printf '%s\n' "${ENV_FILE}" | base64 -w 0)
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" bash -s << ENDSSH
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --quiet "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          docker stop back_results_prod || true
          docker rm back_results_prod || true
          printf '%s' "${ENV_B64}" | base64 -d > .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=\$(wc -c < .env) lines=\$(wc -l < .env)"
          docker run -d \
            --name back_results_prod \
            -p "${{ vars.EXTERNAL_PORT_PROD }}:3000" \
            --env-file .env \
            -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem \
            --restart unless-stopped \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          sleep 2
          docker exec back_results_prod /bin/sh -lc \
            'set -e; [ -f /app/global-bundle.pem ] && echo "bundle OK" && ls -l /app/global-bundle.pem && sha256sum /app/global-bundle.pem | cut -c1-16 || (echo "bundle MISSING"; exit 1)'
          docker exec back_results_prod /bin/sh -lc \
            'env | grep -E "^(MONGODB_URI|MONGODB_USERNAME|MONGODB_PASSWORD|NODE_EXTRA_CA_CERTS)=" | sed "s/=.*/=[REDACTED]/"'
          docker network connect results-net back_results_prod || true
          shred -u .env || rm -f .env
          docker image prune -f
          ENDSSH

      - name: Health check
        run: |
          set -euo pipefail
          echo "Checking http://${{ vars.HETZNER_HOST }}:${{ vars.EXTERNAL_PORT_PROD }}/"
          for i in {1..24}; do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${{ vars.HETZNER_HOST }}:${{ vars.EXTERNAL_PORT_PROD }}/") || true
            if [[ "${http_code:-}" == "200" ]]; then
              echo "Service OK (${http_code})"
              exit 0
            fi
            echo "Retry $i/24 — code=${http_code:-timeout}"
            sleep 5
          done
          echo "Health-check failed, dumping container logs"
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" \
            "docker logs --tail 200 back_results_prod"
          exit 1
