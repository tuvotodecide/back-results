name: CI & CD for NestJS Project

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.ts'
      - 'tsconfig.json'
      - 'src/**'
      - 'test/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_PLATFORMS: linux/amd64
  CACHE_TAG: buildcache

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    name: Run Backend Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: devops_aws
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SSM_ENV_PARAM_NAME: ${{ vars.SSM_ENV_PARAM_NAME }}
      SSM_ENV_PARAM_NAME_SEC: ${{ vars.SSM_ENV_PARAM_NAME_SEC }}
      SSM_ENV_PARAM_NAME_TEST: ${{ vars.SSM_ENV_PARAM_NAME_TEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get .env File
        run: |
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME }}" --with-decryption --query Parameter.Value --output text > .env
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME_SEC }}" --with-decryption --query Parameter.Value --output text >> .env
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME_TEST }}" --with-decryption --query Parameter.Value --output text >> .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=$(wc -c < .env) lines=$(wc -l < .env)"

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run acceptance tests
        run: pnpm test:acceptance

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Cleanup .env
        run: shred -u .env || rm -f .env

  build:
    name: Build & Push Docker image
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: devops_aws
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.12.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Decrypt TLS bundle
        run: |
          set -euo pipefail
          if [ ! -f global-bundle.pem.enc ]; then
            echo "global-bundle.pem.enc not found"; exit 1
          fi
          openssl enc -aes-256-cbc -d -salt \
            -in global-bundle.pem.enc \
            -out global-bundle.pem \
            -pass pass:"${{ secrets.PASSPHRASE }}"
          echo "BUNDLE_SHA256=$(sha256sum global-bundle.pem | cut -d' ' -f1)"

      - name: Set image tag
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          tags="${ECR_REGISTRY}/${ECR_REPO}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=$'\n'"${ECR_REGISTRY}/${ECR_REPO}:latest"
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=$'\n'"${ECR_REGISTRY}/${ECR_REPO}:${GITHUB_REF_NAME}"
          fi
          printf "tags<<EOF\n%s\nEOF\n" "$tags" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-to: type=inline

      - name: Prune old untagged images in ECR
        run: |
          set -euo pipefail
          IMAGE_IDS=$(aws ecr list-images \
            --repository-name "${{ env.ECR_REPO }}" \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*]' --output json)
          if [ "$IMAGE_IDS" != "[]" ]; then
            echo "$IMAGE_IDS" | jq -c '[_nwise(100)][]' | while read -r BATCH; do
              aws ecr batch-delete-image \
                --repository-name "${{ env.ECR_REPO }}" \
                --image-ids "$BATCH"
            done
          fi

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    name: Deploy to Hetzner (dev) via SSH
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: devops_aws
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      EXTERNAL_PORT: ${{ vars.EXTERNAL_PORT }}
      CONTAINER_NAME: back_results
      IMAGE_TAG: ${{ github.sha }}
      SSM_ENV_PARAM_NAME: ${{ vars.SSM_ENV_PARAM_NAME }}
      SSM_ENV_PARAM_NAME_SEC: ${{ vars.SSM_ENV_PARAM_NAME_SEC }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Fetch .env from SSM
        run: |
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME }}" --with-decryption --query Parameter.Value --output text > .env
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME_SEC }}" --with-decryption --query Parameter.Value --output text >> .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=$(wc -c < .env) lines=$(wc -l < .env)"

      - name: Deploy container via SSH
        run: |
          set -euo pipefail
          ECR_TOKEN=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")
          ENV_B64=$(base64 -w 0 < .env)
          shred -u .env || rm -f .env
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" bash -s << ENDSSH
          set -euo pipefail
          echo "${ECR_TOKEN}" | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          docker pull --quiet "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          printf '%s' "${ENV_B64}" | base64 -d > .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=\$(wc -c < .env) lines=\$(wc -l < .env)"
          docker run -d \\
            --name ${{ env.CONTAINER_NAME }} \\
            -p "${{ env.EXTERNAL_PORT }}:3000" \\
            --env-file .env \\
            -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem \\
            --restart unless-stopped \\
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          sleep 2
          docker exec ${{ env.CONTAINER_NAME }} /bin/sh -lc \\
            'set -e; [ -f /app/global-bundle.pem ] && echo "bundle OK" && ls -l /app/global-bundle.pem && sha256sum /app/global-bundle.pem | cut -c1-16 || (echo "bundle MISSING"; exit 1)'
          docker exec ${{ env.CONTAINER_NAME }} /bin/sh -lc \\
            'env | grep -E "^(MONGODB_URI|MONGODB_USERNAME|MONGODB_PASSWORD|NODE_EXTRA_CA_CERTS)=" | sed "s/=.*/=[REDACTED]/"'
          docker network connect results-net ${{ env.CONTAINER_NAME }} || true
          shred -u .env || rm -f .env
          docker image prune -f
          ENDSSH

      - name: Health check
        run: |
          set -euo pipefail
          echo "Checking ${PUBLIC_URL}"
          for i in {1..24}; do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${PUBLIC_URL}") || true
            if [[ "${http_code:-}" == "200" ]]; then
              echo "Service OK (${http_code})"
              exit 0
            fi
            echo "Retry $i/24 — code=${http_code:-timeout}"
            sleep 5
          done
          echo "Health-check failed, dumping container logs"
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" \
            "docker logs --tail 200 ${{ env.CONTAINER_NAME }}"
          exit 1

  deploy-prod:
    name: Deploy to Hetzner (prod) via SSH
    needs: build
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: devops_aws
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO: ${{ vars.ECR_REPOSITORY }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL_PROD }}
      EXTERNAL_PORT: ${{ vars.EXTERNAL_PORT_PROD }}
      CONTAINER_NAME: back_results_prod
      IMAGE_TAG: ${{ github.ref_name }}
      SSM_ENV_PARAM_NAME: ${{ vars.SSM_ENV_PARAM_NAME_PROD }}
      SSM_ENV_PARAM_NAME_SEC: ${{ vars.SSM_ENV_PARAM_NAME_PROD_SEC }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Fetch .env from SSM
        run: |
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME }}" --with-decryption --query Parameter.Value --output text > .env
          aws ssm get-parameter --name "${{ env.SSM_ENV_PARAM_NAME_SEC }}" --with-decryption --query Parameter.Value --output text >> .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=$(wc -c < .env) lines=$(wc -l < .env)"

      - name: Deploy container via SSH
        run: |
          set -euo pipefail
          ECR_TOKEN=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")
          ENV_B64=$(base64 -w 0 < .env)
          shred -u .env || rm -f .env
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" bash -s << ENDSSH
          set -euo pipefail
          echo "${ECR_TOKEN}" | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          docker pull --quiet "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          printf '%s' "${ENV_B64}" | base64 -d > .env
          sed -i 's/\r$//' .env
          echo "ENV bytes=\$(wc -c < .env) lines=\$(wc -l < .env)"
          docker run -d \\
            --name ${{ env.CONTAINER_NAME }} \\
            -p "${{ env.EXTERNAL_PORT }}:3000" \\
            --env-file .env \\
            -e NODE_EXTRA_CA_CERTS=/app/global-bundle.pem \\
            --restart unless-stopped \\
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          sleep 2
          docker exec ${{ env.CONTAINER_NAME }} /bin/sh -lc \\
            'set -e; [ -f /app/global-bundle.pem ] && echo "bundle OK" && ls -l /app/global-bundle.pem && sha256sum /app/global-bundle.pem | cut -c1-16 || (echo "bundle MISSING"; exit 1)'
          docker exec ${{ env.CONTAINER_NAME }} /bin/sh -lc \\
            'env | grep -E "^(MONGODB_URI|MONGODB_USERNAME|MONGODB_PASSWORD|NODE_EXTRA_CA_CERTS)=" | sed "s/=.*/=[REDACTED]/"'
          docker network connect results-net ${{ env.CONTAINER_NAME }} || true
          shred -u .env || rm -f .env
          docker image prune -f
          ENDSSH

      - name: Health check
        run: |
          set -euo pipefail
          echo "Checking ${PUBLIC_URL}"
          for i in {1..24}; do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${PUBLIC_URL}") || true
            if [[ "${http_code:-}" == "200" ]]; then
              echo "Service OK (${http_code})"
              exit 0
            fi
            echo "Retry $i/24 — code=${http_code:-timeout}"
            sleep 5
          done
          echo "Health-check failed, dumping container logs"
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" \
            "docker logs --tail 200 ${{ env.CONTAINER_NAME }}"
          exit 1
